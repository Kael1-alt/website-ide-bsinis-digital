<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Akun - Kaelstore</title>
    <link rel="stylesheet" href="login-style.css">
</head>
<body class="auth-page">
    <div class="aurora aurora-1"></div>
    <div class="aurora aurora-2"></div>
    <div class="aurora aurora-3"></div>
    <div class="grid-overlay"></div>
    <div class="noise"></div>
    <div id="particles"></div>

    <main class="auth-shell">
        <section class="auth-card">
            <div class="card-glow"></div>
            <header class="auth-header">
                <div class="brand"><span class="brand-icon">💼</span><span>Kaelstore</span></div>
                <div class="status"><span></span> BUAT AKUN</div>
                <h1>Gabung Kaelstore<span>.</span></h1>
                <p>Buat akun untuk mulai menggunakan marketplace.</p>
            </header>

            <form id="registerForm" class="auth-form">
                <div class="form-group">
                    <label for="registerName">Nama</label>
                    <div class="input-wrap"><span class="input-icon">◎</span><input id="registerName" type="text" autocomplete="name" placeholder="Nama lengkap" required></div>
                </div>
                <div class="form-group">
                    <label for="registerEmail">Email</label>
                    <div class="input-wrap"><span class="input-icon">✉</span><input id="registerEmail" type="email" autocomplete="email" placeholder="Email aktif" required></div>
                </div>
                <div class="form-group">
                    <label for="registerPhone">Nomor HP</label>
                    <div class="input-wrap"><span class="input-icon">☎</span><input id="registerPhone" type="tel" autocomplete="tel" placeholder="Nomor HP" required></div>
                </div>
                <div class="form-group">
                    <label for="registerPassword">Password</label>
                    <div class="input-wrap"><span class="input-icon">⌑</span><input id="registerPassword" type="password" autocomplete="new-password" minlength="12" placeholder="Minimal 12 karakter" required></div>
                </div>
                <div class="form-group">
                    <label for="requestSeller">Jenis akun</label>
                    <div class="input-wrap">
                        <select id="requestSeller" style="width:100%;padding:14px 12px;border:0;background:transparent;color:inherit;font:inherit">
                            <option value="false">Pembeli</option>
                            <option value="true">Pembeli + ajukan akun penjual</option>
                        </select>
                    </div>
                </div>
                <button type="submit" class="primary-btn"><span>Buat Akun</span><b>→</b></button>
            </form>
            <p class="demo-warning">Gunakan password unik minimal 12 karakter. Permohonan akun penjual perlu disetujui admin.</p>
            <p class="register-text">Sudah punya akun? <a href="login.html">Masuk</a></p>
            <p class="back-home"><a href="index.html">← Kembali ke Beranda</a></p>
        </section>
    </main>

    <div class="toast" id="toast"></div>
    <script>
        const particleBox = document.getElementById("particles");
        for (let index = 0; index < 40; index += 1) {
            const particle = document.createElement("i");
            particle.className = "particle";
            particle.style.left = `${Math.random() * 100}%`;
            particle.style.top = `${Math.random() * 100}%`;
            particle.style.animationDelay = `${Math.random() * 6}s`;
            particle.style.animationDuration = `${4 + Math.random() * 7}s`;
            particle.style.setProperty("--size", `${1 + Math.random() * 3}px`);
            particleBox.appendChild(particle);
        }

        const form = document.getElementById("registerForm");
        const toast = document.getElementById("toast");
        form.addEventListener("submit", async event => {
            event.preventDefault();
            const button = form.querySelector('[type="submit"]');
            button.disabled = true;
            try {
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name: document.getElementById("registerName").value.trim(),
                        email: document.getElementById("registerEmail").value.trim(),
                        phone: document.getElementById("registerPhone").value.trim(),
                        password: document.getElementById("registerPassword").value,
                        requestSeller: document.getElementById("requestSeller").value === "true"
                    })
                });
                const result = await response.json();
                if (!response.ok) throw new Error(result.error || "Tidak dapat membuat akun.");
                localStorage.setItem("kaelstore-session", JSON.stringify(result.user));
                window.location.href = "account.html";
            } catch (error) {
                toast.textContent = error instanceof TypeError
                    ? "Server akun tidak terhubung. Buka halaman melalui server Kaelstore."
                    : error.message;
                toast.classList.add("show");
            } finally {
                button.disabled = false;
            }
        });
    </script>
</body>
</html>
